spring:
  application:
    name: ai-dating-agent-backend
  datasource:
    url: jdbc:mysql://localhost:3306/ai_dating_agent
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model: ${OPENAI_MODEL:gpt-5.2}
